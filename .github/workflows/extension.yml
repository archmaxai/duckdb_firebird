name: Build & publish extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            os: ubuntu-22.04
          - platform: linux_arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - platform: osx_amd64
            os: macos-13
          - platform: osx_arm64
            os: macos-14
          - platform: windows_amd64
            os: windows-latest
    env:
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
      # Used only by the linux_arm64 cross build; ignored elsewhere.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}

      - name: Install aarch64 cross linker
        if: matrix.platform == 'linux_arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build extension
        shell: bash
        run: ./scripts/build.sh

      - name: Compress
        shell: bash
        run: gzip -9 -kf build/firebird.duckdb_extension

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.platform }}
          path: |
            build/firebird.duckdb_extension
            build/firebird.duckdb_extension.gz
          if-no-files-found: error

  # Publish a DuckDB "custom extension repository" to GitHub Pages so the
  # extension can be installed directly from DuckDB:
  #
  #   SET custom_extension_repository = 'https://<owner>.github.io/<repo>';
  #   INSTALL firebird;  LOAD firebird;
  #
  # (start DuckDB with `-unsigned` / allow_unsigned_extensions=true)
  deploy-pages:
    name: publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Lay out extension repository
        shell: bash
        run: |
          set -euo pipefail
          # DuckDB resolves <repo>/<duckdb_version>/<platform>/<name>.duckdb_extension.gz
          # using the *client's* version string. Our C-API (v1.2.0) binary is the
          # same across these releases, so we fan a single build out to each.
          DUCKDB_VERSIONS="v1.4.0 v1.4.1 v1.5.0 v1.5.1 v1.5.2 v1.5.3"
          mkdir -p _site
          for dir in artifacts/ext-*; do
            platform="$(basename "$dir")"
            platform="${platform#ext-}"
            gz="$dir/firebird.duckdb_extension.gz"
            [ -f "$gz" ] || { echo "missing $gz" >&2; exit 1; }
            for v in $DUCKDB_VERSIONS; do
              mkdir -p "_site/$v/$platform"
              cp "$gz" "_site/$v/$platform/firebird.duckdb_extension.gz"
            done
            echo "laid out $platform"
          done
          # Friendly landing page.
          {
            echo "<!doctype html><meta charset=utf-8><title>firebird duckdb extension</title>"
            echo "<h1>firebird — DuckDB extension repository</h1>"
            echo "<pre>"
            echo "duckdb -unsigned"
            echo "SET custom_extension_repository = '${{ steps.pages.outputs.base_url || 'https://OWNER.github.io/REPO' }}';"
            echo "INSTALL firebird;"
            echo "LOAD firebird;"
            echo "</pre>"
            echo "<p>DuckDB versions served: $DUCKDB_VERSIONS</p>"
          } > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # On a version tag, also attach the raw binaries to a GitHub Release so they
  # can be downloaded and LOAD'ed directly.
  release:
    name: attach release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename per-platform assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/ext-*; do
            platform="$(basename "$dir")"
            platform="${platform#ext-}"
            cp "$dir/firebird.duckdb_extension" "release/firebird.${platform}.duckdb_extension"
          done
          ls -la release

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
