[package]
name = "duckdb_firebird"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension to read Firebird databases directly via the pure-Rust Firebird wire protocol"
license = "MIT"

[lib]
name = "firebird"
crate-type = ["cdylib"]

[dependencies]
duckdb = { version = "=1.10503.1", features = ["loadable-extension"] }
rsfbclient = { version = "0.26", default-features = false, features = ["pure_rust"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = 2
